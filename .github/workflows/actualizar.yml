name: Actualizar plazas

on:
  schedule:
    - cron: "0 6 * * *"   # cada día, 06:00 UTC
  workflow_dispatch:       # botón "Run workflow"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ejecutar scraper del BOE
        run: python scrapers/boe.py --dias 30

      - name: Guardar datos si han cambiado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/plazas.json
          git diff --cached --quiet || git commit -m "Actualizar datos"
          git push

      - name: Montar el sitio
        run: |
          mkdir -p _site/data
          cp web/index.html web/app.js web/styles.css _site/
          cp data/plazas.json _site/data/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
